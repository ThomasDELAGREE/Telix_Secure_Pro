version: '3.9'

services:

  captive-portal:
    build: ../captive-portal
    ports:
      - "8080:80"
    environment:
      - REACT_APP_API_URL=http://auth-service:8000
    depends_on:
      - auth-service
    restart: unless-stopped

  auth-service:
    build: ../auth-service
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  proxy-service:
    build: ../proxy-service
    ports:
      - "3128:3128"
    env_file: .env
    restart: unless-stopped

  log-service:
    image: graylog/graylog:6.0
    ports:
      - "9000:9000"
      - "12201:12201/udp"
    env_file: .env
    depends_on:
      - elasticsearch
      - mongo
    restart: unless-stopped

  siem-connector:
    build: ../siem-connector
    env_file: .env
    depends_on:
      - log-service
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  mongo:
    image: mongo:6
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  gateway:
    build: ../gateway
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - captive-portal
      - auth-service
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  es_data:
  mongo_data:
