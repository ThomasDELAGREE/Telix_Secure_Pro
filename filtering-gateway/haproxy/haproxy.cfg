# Configuration HAProxy -- repartition sans etat devant filtering-gateway
# STATUT : base standard non testee avec des tunnels WireGuard reels
# (voir README.md, point bloquant #5). A valider par un PoC.

global
    log stdout format raw local0
    maxconn 20000

defaults
    log     global
    mode    tcp
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# --- Repartition du trafic WireGuard (UDP) vers les instances e2guardian ---
# NOTE : la syntaxe ci-dessous est une base a adapter/valider selon la
# version reellement installee (a confirmer lors du PoC).
frontend wireguard_in
    bind *:51820
    mode tcp
    default_backend e2guardian_pool

backend e2guardian_pool
    mode tcp
    balance leastconn
    server e2guardian_1 filtering-gateway-e2guardian-1:8080 check

# --- Sante de l'API interne (distribution blocklist, rejeu des logs) ---
frontend api_in
    bind *:8090
    mode http
    default_backend api_pool

backend api_pool
    mode http
    server api_1 filtering-gateway-api-1:8090 check
