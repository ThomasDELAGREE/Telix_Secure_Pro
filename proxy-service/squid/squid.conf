# Configuration Squid — Telix_Secure_Pro proxy-service

acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_port 3128

# --- Authentification via auth-service (mapping IP -> utilisateur dans Redis) ---
external_acl_type telix_auth ttl=30 negative_ttl=5 %SRC /usr/local/bin/session_helper.py
acl telix_authenticated external telix_auth

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow telix_authenticated
http_access deny all

# --- Format de log JSON pour la tracabilite (consomme par gelf_shipper.py) ---
logformat telix_json {"timestamp":"%tl","client_ip":"%>a","user":"%un","method":"%rm","url":"%ru","status":%>Hs,"bytes":%<st,"duration_ms":%tr,"user_agent":"%{User-Agent}>h"}
access_log daemon:/var/log/squid/access.log telix_json
cache_log /var/log/squid/cache.log

coredump_dir /var/spool/squid

refresh_pattern ^ftp:  1440 20% 10080
refresh_pattern ^gopher: 1440 0% 1440
refresh_pattern -i (/cgi-bin/|\?) 0 0% 0
refresh_pattern . 0 20% 4320
