# Redirection HTTP -> HTTPS (obligatoire pour tout portail captif serieux :
# les identifiants ne doivent jamais transiter en clair)
server {
    listen 80;
    server_name _;

    # Permet malgre tout aux equipements Wi-Fi de detecter le portail captif
    # (certains systemes de detection captive font une requete HTTP simple
    # avant d'accepter la redirection HTTPS)
    location / {
        return 301 https://$host$request_uri;
    }
}
