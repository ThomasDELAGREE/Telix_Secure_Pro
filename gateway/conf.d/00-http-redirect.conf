# Redirection HTTP -> HTTPS, SAUF pour le challenge ACME HTTP-01 de Certbot
# qui doit rester accessible en clair sur le port 80 pour que Let's Encrypt
# puisse valider la possession du domaine.
server {
    listen 80;
    server_name _;

    # Challenge ACME HTTP-01 : fichiers deposes par Certbot dans ce repertoire,
    # partage via le volume 'certbot_webroot'.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Permet malgre tout aux equipements Wi-Fi de detecter le portail captif
    # (certains systemes de detection captive font une requete HTTP simple
    # avant d'accepter la redirection HTTPS)
    location / {
        return 301 https://$host$request_uri;
    }
}
