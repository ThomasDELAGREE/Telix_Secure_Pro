# Vhost principal HTTPS : point d'entree unique du portail captif.
# Route vers captive-portal (frontend) et auth-service (API), applique
# TLS, rate limiting et headers de securite.
#
# Certificat : utilise en priorite le certificat Let's Encrypt emis par Certbot
# si present dans /etc/letsencrypt/live/<domaine>/ (volume partage en lecture
# avec le conteneur certbot), sinon retombe sur le certificat auto-signe de
# secours genere par entrypoint.sh. Ce choix est fait au moment du build via la
# variable GATEWAY_SERVER_NAME injectee dans ce fichier par entrypoint.sh
# (voir gateway/README.md pour le detail du mecanisme de bascule).
server {
    listen 443 ssl;
    server_name _;

    # Ces deux chemins sont mis a jour au demarrage par entrypoint.sh selon la
    # presence ou non d'un certificat Let's Encrypt valide pour le domaine.
    ssl_certificate     /etc/nginx/certs/telix.crt;
    ssl_certificate_key /etc/nginx/certs/telix.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    include /etc/nginx/snippets/security-headers.conf;

    limit_req zone=telix_global burst=20 nodelay;

    # --- Frontend : interface du portail captif (React) ---
    location / {
        proxy_pass         http://captive-portal:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- API d'authentification : rate limiting renforce (anti brute-force) ---
    location /api/auth/ {
        limit_req zone=telix_auth burst=3 nodelay;

        proxy_pass         http://auth-service:8000/auth/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Verification de sante (usage interne / supervision) ---
    location /api/health {
        proxy_pass         http://auth-service:8000/health;
        proxy_set_header   Host $host;
    }
}
