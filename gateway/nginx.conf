user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format telix_gateway '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rt=$request_time';

    access_log  /var/log/nginx/access.log  telix_gateway;

    sendfile        on;
    keepalive_timeout  65;

    # Zone de limitation de debit globale (protection brute-force / DoS basique)
    limit_req_zone $binary_remote_addr zone=telix_global:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=telix_auth:10m rate=5r/m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/conf.d/*.conf;
}
