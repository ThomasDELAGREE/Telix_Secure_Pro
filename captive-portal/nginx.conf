# Configuration Nginx minimale pour servir le build React (SPA).
# Ce conteneur est la cible finale du proxy host Nginx Proxy Manager
# (voir npm-provisioning/, variable TELIX_FORWARD_HOST=captive-portal).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Toutes les routes inconnues renvoient vers index.html (routage cote
    # client gere par react-router-dom).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
