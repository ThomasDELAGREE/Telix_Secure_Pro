# Pipeline Logstash : reception des logs de trafic web (GELF, envoyes par
# Graylog via un output GELF configure manuellement sur le stream
# "Telix - Traffic Web", voir docs/siem-connector.md), reformatage au format
# CEF (Common Event Format, standard largement supporte par les SIEM dont
# Sekoia), puis envoi vers l'intake Sekoia en syslog/TLS.

input {
  gelf {
    port => 12202
    # Port distinct de celui utilise par proxy-service -> log-service
    # (12201), pour ne pas interferer avec l'ingestion primaire de Graylog.
  }
}

filter {
  # Les champs GELF issus de Graylog sont prefixes de leur nom d'origine.
  # On les renomme vers des noms explicites, coherents avec le vocabulaire
  # CEF, pour limiter la logique de mapping au minimum necessaire.
  mutate {
    rename => {
      "[user_identifier]"   => "suser"
      "[identifier_type]"   => "cs1"
      "[mac_address]"       => "cs2"
      "[client_ip]"         => "src"
      "[http_method]"       => "requestMethod"
      "[http_url]"          => "request"
      "[http_status]"       => "outcome"
      "[bytes_sent]"        => "out"
      "[duration_ms]"       => "cn1"
    }
    add_field => {
      "cs1Label" => "identifierType"
      "cn1Label" => "durationMs"
    }
  }

  # Ecarte les champs techniques GELF non pertinents pour le SIEM, pour ne
  # pas polluer l'extension CEF envoyee a Sekoia.
  mutate {
    remove_field => ["version", "host", "facility", "level", "@version", "@timestamp", "gl2_source_input", "gl2_remote_ip"]
  }

  # Determine une severite CEF (0-10) a partir du code HTTP retourne, pour
  # que les echecs d'acces ou anomalies (4xx/5xx) ressortent plus facilement
  # dans les regles de correlation Sekoia.
  ruby {
    code: '
      status = event.get("outcome").to_i rescue 0
      severity = if status >= 500 then 7
                 elsif status >= 400 then 5
                 else 2
                 end
      event.set("cef_severity", severity)
    '
  }
}

output {
  tcp {
    host => "${SEKOIA_SYSLOG_HOST}"
    port => "${SEKOIA_SYSLOG_PORT}"
    ssl_enable => true
    # Le certificat de l'intake Sekoia est verifie via les autorites de
    # certification systeme presentes dans l'image (pas de certificat client
    # requis pour un intake syslog/TLS standard Sekoia).
    ssl_verify => true
    codec => cef {
      version => "0"
      vendor => "TelixSecurePro"
      product => "CaptivePortal"
      device_version => "1.0"
      signature => "web-traffic"
      name => "Acces web trace via portail captif"
      severity => "%{cef_severity}"
      fields => ["suser", "cs1", "cs1Label", "cs2", "src", "requestMethod", "request", "outcome", "out", "cn1", "cn1Label"]
    }
  }

  # Copie locale pour diagnostic (desactivable en production).
  stdout {
    codec => rubydebug
  }
}
